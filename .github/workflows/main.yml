name: Build TaxiRecettes APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract TaxiRecettes source
        run: |
          unzip -o TaxiRecettes-v1.2-source.zip
          ls -la TaxiRecettes-v1.2-source

      - name: Build APK
        working-directory: TaxiRecettes-v1.2-source
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaxiRecettes-v1.2-APK
          path: TaxiRecettes-v1.2-source/app/build/outputs/apk/debug/app-debug.apk
